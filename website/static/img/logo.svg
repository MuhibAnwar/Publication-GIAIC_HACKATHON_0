<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <style>
    .title { 
      font: bold 20px sans-serif; 
      fill: white; 
    }
    .subtitle { 
      font: 12px sans-serif; 
      fill: #aaddff; 
    }
    .icon {
      fill: #4fc3f7;
    }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a237e" rx="5"/>
  
  <!-- Robot icon -->
  <g class="icon" transform="translate(20, 15)">
    <rect x="5" y="5" width="20" height="20" rx="3"/>
    <circle cx="10" cy="12" r="2"/>
    <circle cx="20" cy="12" r="2"/>
    <rect x="8" y="25" width="4" height="10"/>
    <rect x="18" y="25" width="4" height="10"/>
    <rect x="5" y="35" width="20" height="3" rx="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="25" class="title">Physical AI</text>
  <text x="55" y="40" class="title">&amp; Humanoid Robotics</text>
  <text x="55" y="55" class="subtitle">Textbook Platform</text>
</svg>